# robot_localization, dual-EKF setup. See car_tracker_design/architecture.md.
#
# ekf_odom  (world_frame: odom) publishes odom -> base_footprint. Always on.
# ekf_map   (world_frame: map)  publishes map  -> base_footprint. OPTIONAL.
#
# THE LANDMINE: slam_toolbox publishes map -> odom itself. Running ekf_map as
# well gives two broadcasters on one transform. TF does not error -- it
# interleaves them and the robot appears to vibrate through walls.
#
# Start with ekf_odom only and let slam_toolbox own map -> odom. Only enable
# ekf_map after setting slam_toolbox's transform_publish_period to 0.0, and only
# once there is a second absolute source (GPS, AprilTags) to justify it. With
# lidar alone it is added latency and tuning for near-zero gain.

ekf_odom:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    # Non-negotiable for a ground robot: locks Z, roll and pitch so noise on
    # those axes cannot leak into the planar estimate.
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    # world_frame == odom_frame is what makes this the LOCAL filter: continuous,
    # no jumps, safe for the controller to differentiate.
    world_frame: odom

    # /odom_raw is rf2o laser odometry, NOT the vendor's dead reckoning.
    #
    # This board has no encoders -- the ros_robot_controller protocol has a
    # motor COMMAND packet and no motor report -- so odom_publisher only replayed
    # commanded velocity. Measured 2026-09-02 it published vx=0 with covariance
    # 1e-9, i.e. "the robot is stationary and I am certain to 0.03 mm/s", which
    # pinned this filter's translation to zero no matter what any other sensor
    # said. It now runs with pub_odom_topic:=false and rf2o owns the name.
    #
    # rf2o scan-matches consecutive lidar frames into real planar velocity.
    #
    # KNOWN DEFECT: rf2o hardcodes twist.linear.y = 0.0 and publishes an all-zero
    # covariance, which robot_localization replaces with 1e-9. Fusing vy here is
    # therefore an infinitely confident "no lateral motion" on a holonomic base --
    # the same failure odom_raw caused. Fix is to fuse pose x/y with
    # odom0_differential: true and publish rf2o's own cov_odo. See nodes/ekf.md.
    odom0: odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU: yaw RATE only.
    #
    # Not absolute yaw -- no magnetometer indoors, motors and rebar wreck it.
    # Not linear acceleration -- a 1 degree attitude error leaks
    # g*sin(1deg) = 0.17 m/s^2 into the horizontal axes, which is a third of
    # this robot's real acceleration and integrates without bound. Translational
    # drift is corrected by lidar SLAM, not by the IMU.
    #
    # CONFIRMED: Hiwonder's controller.launch.py runs its OWN ekf_node that
    # already fuses their odom_raw + odom_rf2o + imu and publishes it as /odom.
    # We launch their controller with enable_odom:=false, which frees that name
    # for this filter's own output. Fusing theirs would double-count the IMU
    # and make this filter
    # overconfident -- it would drift smoothly while reporting tight
    # covariance, which is the worst failure mode because it looks healthy.
    #
    # For reference their config fuses yaw twice over (odom0 yaw rate, imu0
    # absolute yaw AND yaw rate), which is exactly what not to do.
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

ekf_map:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    # world_frame == map_frame makes this the GLOBAL filter. Its output jumps on
    # loop closure, which is correct but means the controller must never
    # differentiate it for velocity.
    world_frame: map

    odom0: odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: true

    # Absolute pose from slam_toolbox. Requires transform_publish_period: 0.0 in
    # slam_toolbox.yaml, or this fights slam_toolbox for map -> odom.
    pose0: slam_pose
    pose0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
