# Launch-time wiring for the MentorPi depth camera.
#
# Read by camera.launch.py via yaml.safe_load when the launch description is
# built. These CANNOT be ROS parameters: remaps and launch paths are resolved
# before any node exists. Runtime tunables live in camera_params.yaml.
#
# Verified against github.com/Hiwonder/MentorPi (peripherals/launch/
# depth_camera.launch.py and launch/include/ascamera.launch.py).

# Hiwonder's wrapper dispatches on the DEPTH_CAMERA_TYPE env var: 'ascamera'
# gives the Angstrong depth camera, anything else falls back to usb_cam for the
# monocular version.
#
# HEADS UP: the underlying `ascamera` package is NOT in the MentorPi repo. It
# lives in a separate third_party_ros2/third_party_ws on Hiwonder's SD image,
# referenced by absolute path (/home/ubuntu/third_party_ros2/...). It is the one
# driver that still has to be recovered from the image or from Angstrong.
driver:
  package: peripherals
  launch_file: depth_camera.launch.py

# Same env vars as robot_wiring.yaml -- their launch files use os.environ[...],
# so an unset variable is a KeyError that aborts the launch.
env:
  need_compile: 'True'
  DEPTH_CAMERA_TYPE: ascamera

# vendor topic -> normalized name
#
# ascamera_node runs under namespace="ascamera", hence the prefix. Confirm the
# leaf names on the robot once the driver is recovered:
#   ros2 topic list -t | grep -i ascamera
#
# The vendor publishes .../image_compressed instead of the conventional
# .../image_raw/compressed, which breaks image_transport's compressed-topic
# discovery. That remap is what makes it work downstream.
remaps:
  ascamera/camera_publisher/rgb0/image: camera/color/image_raw
  ascamera/camera_publisher/rgb0/image_compressed: camera/color/image_raw/compressed
  ascamera/camera_publisher/rgb0/camera_info: camera/color/camera_info
  ascamera/camera_publisher/depth0/image_raw: camera/depth/image_rect_raw
  ascamera/camera_publisher/depth0/camera_info: camera/depth/camera_info

# Internal pipeline stage names, so the whole topic graph is described here
# rather than split between this file and the launch file.
pipeline:
  color_image: camera/color/image_raw
  color_info: camera/color/camera_info
  downscaled_image: camera/color/downscaled/image_raw
  downscaled_info: camera/color/downscaled/camera_info
