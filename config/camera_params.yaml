# Runtime ROS parameters for the MentorPi depth camera nodes.
#
# Launch-time wiring (topic names, driver executable) is in camera_wiring.yaml,
# not here -- remaps are resolved before nodes exist and can never be params.
#
# Node names must match the `name=` given in camera.launch.py, or these are
# silently ignored. The /**: wildcard applies to every node.

/**:
  ros__parameters:
    use_sim_time: false

# Vendor Angstrong driver.
#
# UNVERIFIED. These are the shape of the block, not confirmed vendor API. Dump
# the real ones with `ros2 param dump /ascamera` and replace wholesale.
# Node name is camera_publisher, NOT ascamera. The vendor names its node
# camera_publisher and publishes private (~/) topics under it, so a section
# keyed 'ascamera' silently never applies. The /**/ prefix is also required: the
# node's fully qualified name is /ascamera/camera_publisher, and a bare
# 'camera_publisher:' key does not match a namespaced node -- and the driver then starts
# streaming and stops one second later, because the size/fps parameters it
# requires are left unset.
/**/ascamera:
  ros__parameters:
    # Must agree with the URDF or the projection into the map frame is silently
    # wrong -- and a wrong extrinsic looks exactly like a SLAM tuning problem.
    color_frame_id: camera_color_optical_frame
    depth_frame_id: camera_depth_optical_frame
    # Required by the SDK; without them the stream does not stay up.
    rgb_width: 640
    rgb_height: 480
    depth_width: 640
    depth_height: 480
    fps: 15
    pub_tfTree: true
    # The driver's own coloured cloud measured 194 Mbit/s. Leave it off and
    # regenerate desktop-side from depth + camera_info when a cloud is needed.
    color_pcl: false
    usb_bus_no: -1
    usb_path: "null"

camera_resize:
  ros__parameters:
    use_scale: false
    # 4:3 to match the vendor's 640x480. Do NOT use 640x360 -- that is 16:9 and
    # would stretch the image, which biases a texture-based terrain classifier.
    width: 480
    height: 360
    # 0=NEAREST 1=LINEAR 2=CUBIC 3=AREA 4=LANCZOS4.
    # AREA is better for large downscales, LINEAR is cheaper on the Pi. Revisit
    # if the segmentation model turns out to be sensitive to aliasing.
    interpolation: 1

camera_republish:
  ros__parameters:
    # JPEG quality for the Pi->desktop wire stream. 60-70 is plenty for terrain
    # texture; raise it if the classifier starts seeing block artifacts.
    format: jpeg
    jpeg_quality: 65
