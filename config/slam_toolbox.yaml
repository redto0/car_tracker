# slam_toolbox, online async mode. Runs on the Pi.
#
# Copied from slam_toolbox's mapper_params_online_async.yaml and tuned for the
# MentorPi. Async drops scans it cannot process in time rather than falling
# behind, which is the right trade on a Pi 5.
#
# transform_publish_period: set to 0.0 to STOP slam_toolbox publishing
# map -> odom, which is required before enabling ekf_map. Leaving both on puts
# two broadcasters on one transform and TF will not complain.
#
# base_frame may need to be base_footprint on this robot -- confirm with
#   ros2 run tf2_tools view_frames

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint  # verified: Hiwonder controller.launch.py default
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.0 #for rastering images
    max_laser_range: 12.0  #for rastering images -- STL-19P is ~12 m
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Both zero: process every scan minimum_time_interval allows, rather than
    # only after the robot has travelled.
    #
    # These gate shouldProcessScan() on ODOMETRY travel. At 0.2 they are wrong
    # for this robot in two ways. Heading never trips at all -- yaw comes from
    # the IMU, which is stable at rest, so the robot can sit still indefinitely.
    # And translation comes from rf2o, whose drift at rest was measured at
    # 1.5 cm/min on 2026-09-04, so 0.2 m takes about 13 minutes of standing
    # still to reach. The result was a map that published one frame at startup
    # and then republished that identical frame forever.
    #
    # minimum_time_interval: 0.5 remains the real rate limit, so this costs at
    # most 2 scans/second rather than the full 10 Hz.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
